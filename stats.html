<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>飲料統計</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="stats-container">

    <h1>📊 飲料統計</h1>

    <p class="stats-subtitle">
      看看最近都喝了什麼
    </p>


    <!-- 總覽 -->

    <div class="stats-grid">

      <div class="stat-card">

        <div class="stat-label">
          總共喝了
        </div>

        <div
          class="stat-number"
          id="totalDrinks"
        >
          0
        </div>

        <div class="stat-unit">
          杯
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          本月喝了
        </div>

        <div
          class="stat-number"
          id="monthDrinks"
        >
          0
        </div>

        <div class="stat-unit">
          杯
        </div>

      </div>

    </div>


    <!-- 使用者統計 -->

    <section class="stats-section">

      <h2>
        👤 使用者
      </h2>

      <div
        id="userStats"
        class="user-stats-grid"
      >
      </div>

    </section>


    <!-- 店家排行 -->

    <section class="stats-section">

      <h2>
        🏪 最常喝的店家
      </h2>

      <div
        id="shopRanking"
        class="ranking-list"
      >
      </div>

    </section>


    <!-- 飲料排行 -->

    <section class="stats-section">

      <h2>
        🧋 最常喝的飲料
      </h2>

      <div
        id="drinkRanking"
        class="ranking-list"
      >
      </div>

    </section>


    <a
      href="index.html"
      class="back-btn"
    >
      ← 返回首頁
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>
  
  <script src="stats.js"></script>

</body>

</html>
