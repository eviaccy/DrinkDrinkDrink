<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>飲料歷史紀錄</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="records-container">


    <!-- =========================
         篩選區
    ========================== -->

    <div class="filter-bar">

      <!-- 搜尋飲料 -->

      <input
        type="text"
        id="searchInput"
        placeholder="搜尋飲料名稱"
      >


      <!-- 使用者篩選 -->

      <select id="userFilter">

        <option value="">
          全部使用者
        </option>

      </select>


      <!-- 店家篩選 -->

      <select id="shopFilter">

        <option value="">
          全部店家
        </option>

      </select>


      <!-- 日期篩選 -->

      <input
        type="date"
        id="dateFilter"
      >


      <!-- 清除篩選 -->

      <button
        type="button"
        id="clearFilterBtn"
        class="clear-filter-btn"
      >
        清除篩選
      </button>

    </div>



    <!-- =========================
         標題
    ========================== -->

    <h1 class="records-title">
      飲料歷史紀錄
    </h1>



    <!-- =========================
         歷史紀錄表格
    ========================== -->

    <div class="table-wrapper">

      <table class="records-table">


        <!-- 表格標題 -->

        <thead>

          <tr>

            <th>
              Date
            </th>

            <th>
              Who
            </th>

            <th>
              Where
            </th>

            <th>
              What
            </th>

            <th>
              Edit
            </th>

          </tr>

        </thead>


        <!--
          records.js
          會自動把紀錄放進這裡
        -->

        <tbody id="recordsTableBody">

        </tbody>


      </table>

    </div>



    <!-- =========================
         返回首頁
    ========================== -->

    <a
      href="index.html"
      class="back-btn"
    >
      ← 返回首頁
    </a>


  </div>



  <!-- =========================
       JavaScript
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>
  
  <script src="records.js"></script>


</body>

</html>
