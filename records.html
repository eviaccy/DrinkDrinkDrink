<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>飲料歷史紀錄</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="records-container">


    <!-- =========================
         篩選區
    ========================== -->

    <div class="filter-bar">
      <select id="userFilter" aria-label="使用者"><option value="">全部使用者</option></select>
      <select id="shopFilter" aria-label="店家"><option value="">全部店家</option></select>
      <select id="drinkFilter" aria-label="飲料名稱"><option value="">全部飲料</option></select>
      <select id="yearFilter" aria-label="年份"><option value="">全部年份</option></select>
      <select id="monthFilter" aria-label="月份"><option value="">全部月份</option></select>
      <select id="sortFilter" aria-label="日期排序">
        <option value="newest">最新日期優先</option>
        <option value="oldest">最舊日期優先</option>
      </select>
      <button type="button" id="clearFilterBtn" class="clear-filter-btn">清除篩選</button>
    </div>



    <!-- =========================
         標題
    ========================== -->

    <h1 class="records-title">
      飲料歷史紀錄
    </h1>



    <!-- =========================
         歷史紀錄表格
    ========================== -->

    <div class="table-wrapper">

      <table class="records-table">


        <!-- 表格標題 -->

        <thead>

          <tr>

            <th>
              Date
            </th>

            <th>
              Who
            </th>

            <th>
              Where
            </th>

            <th>
              What
            </th>

            <th>
              Edit
            </th>

          </tr>

        </thead>


        <!--
          records.js
          會自動把紀錄放進這裡
        -->

        <tbody id="recordsTableBody">

        </tbody>


      </table>

    </div>



    <!-- =========================
         返回首頁
    ========================== -->

    <a
      href="index.html"
      class="back-btn"
    >
      ← 返回首頁
    </a>


  </div>



  <!-- =========================
       JavaScript
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>
  
  <script src="records.js"></script>


</body>

</html>
